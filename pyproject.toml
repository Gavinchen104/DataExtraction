[project]
name = "dataextraction"
version = "0.1.0"
description = "LoRA fine-tune of Llama-3-8B for structured field extraction from invoices and contracts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=2.19.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]
train = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
    "wandb>=0.17.0",
]
serve = [
    "vllm>=0.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
